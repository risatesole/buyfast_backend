name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_ENVIRONMENT: development
      DJANGO_DBMS: sqlite3

      PLATFORM_NAME: buyfast

      POSTGRESQL_DATABASE_NAME: dummy
      POSTGRESQL_DATABASE_USER: dummy
      POSTGRESQL_DATABASE_PASSWORD: dummy
      POSTGRESQL_DATABASE_HOST: localhost
      POSTGRESQL_DATABASE_PORT: "5432"

      MEDIA_ROOT: ./media
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

      STATIC_URL: /static/

      SUPABASE_PROJECT_ID: dummy
      SUPABASE_SECRET_KEY: dummy
      SUPABASE_BUCKET: dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python manage.py test
